<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Press Start</title>
<style>
  :root {
    --bg: #000000;
    --panel: #0d0d0d;
    --panel-2: #151515;
    --line: #5c0e14;        /* dark red outline */
    --line-2: #7a1018;
    --text: #d4202e;        /* dark red text */
    --dim: #ff4652;         /* bright red small text */
    --accent: #ff4652;
    --gold: #ffd23f;
    --pink: #ff69b4;
    --purple: #a855f7;
    --gr: 255; --gg: 59; --gb: 71; /* glitch bg rgb */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Courier New", Courier, monospace;
    font-size: 16px;
    min-height: 100vh;
    line-height: 1.55;
  }
  h1, h2, h3 { letter-spacing: 1px; text-transform: uppercase; font-weight: 700; color: var(--text); }
  button { font: inherit; }

  /* animated glitchy background */
  #glitch-bg {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      repeating-linear-gradient(0deg, rgba(var(--gr), var(--gg), var(--gb), 0.18) 0 2px, transparent 2px 6px),
      radial-gradient(circle at 20% 15%, rgba(var(--gr), var(--gg), var(--gb), 0.17), transparent 55%),
      radial-gradient(circle at 80% 85%, rgba(var(--gr), var(--gg), var(--gb), 0.15), transparent 55%);
    animation: bgGlitch 5s steps(1) infinite;
  }
  #glitch-bg::before, #glitch-bg::after {
    content: ""; position: absolute; left: 0; right: 0; height: 130px;
    background: repeating-linear-gradient(0deg, rgba(var(--gr), var(--gg), var(--gb), 0.35) 0 1px, transparent 1px 4px);
    opacity: 0;
  }
  #glitch-bg::before { top: 12%; animation: sliceGlitch 7s steps(1) infinite; }
  #glitch-bg::after { top: 64%; animation: sliceGlitch 7s steps(1) infinite; animation-delay: 3.5s; }
  @keyframes sliceGlitch {
    0%, 100% { opacity: 0; transform: none; }
    40% { opacity: 0.9; transform: translateX(-40px); }
    42% { opacity: 0; }
    71% { opacity: 0.7; transform: translateX(50px); }
    73% { opacity: 0; }
  }
  @keyframes bgGlitch {
    0%, 100% { opacity: 0.7; transform: none; }
    38% { opacity: 0.85; }
    40% { opacity: 1; transform: translateX(-4px) skewX(-1deg); }
    42% { opacity: 0.85; transform: translateX(4px); }
    44% { opacity: 1; transform: translateY(2px) skewX(1deg); }
    46% { opacity: 0.7; transform: none; }
    70% { opacity: 0.95; }
    72% { opacity: 0.7; }
  }
  @media (prefers-reduced-motion: reduce) { #glitch-bg { animation: none !important; opacity: 0.5; } #glitch-bg::before, #glitch-bg::after { display: none; } }

  .wrap { max-width: 760px; margin: 0 auto; padding: 18px 16px 48px; position: relative; z-index: 1; }

  /* top bar */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 20px; }
  .topbar .title { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: var(--text); flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn-back, .btn-plain {
    background: var(--panel); border: 2px solid var(--line); color: var(--text);
    padding: 8px 14px; cursor: pointer; font-size: 13px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .btn-back:hover, .btn-plain:hover { border-color: var(--accent); color: var(--accent); }
  .btn-back:disabled { visibility: hidden; }
  .coin-pill { background: var(--panel); border: 2px solid var(--line); padding: 7px 13px; font-size: 14px; }
  .coin-pill .lbl { color: var(--dim); font-size: 10px; letter-spacing: 1px; margin-right: 6px; }
  .coin-pill .num { color: var(--text); font-weight: 700; }
  .btn-admin {
    background: var(--panel); border: 2px solid var(--line); color: var(--text);
    padding: 7px 11px; cursor: pointer; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .btn-admin:hover { border-color: var(--accent); color: var(--accent); }

  .screen { animation: fadeIn 200ms ease-out both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }

  /* splash */
  .splash { min-height: 72vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer; }
  .splash h1 { font-size: 44px; letter-spacing: 8px; color: var(--accent); animation: blink 1.4s steps(1) infinite; text-transform: uppercase; }
  .splash .sub { margin-top: 14px; color: var(--dim); font-size: 13px; letter-spacing: 3px; text-transform: uppercase; }
  .splash .stats { margin-top: 8px; color: var(--dim); font-size: 11px; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

  .section-head { margin-bottom: 18px; }
  .section-head h2 { font-size: 16px; margin-bottom: 4px; }
  .section-head h2 span { color: var(--accent); }
  .section-head p { font-size: 13px; color: var(--dim); text-transform: none; }

  /* menu cards */
  .menu-grid { display: grid; gap: 10px; }
  .menu-card {
    background: var(--panel); border: 2px solid var(--line);
    padding: 15px 16px; text-align: left; cursor: pointer; width: 100%;
    transition: border-color 130ms ease-out, background 130ms ease-out;
  }
  .menu-card:hover { border-color: var(--accent); background: var(--panel-2); }
  .menu-card h3 { font-size: 14px; margin-bottom: 3px; }
  .menu-card p { font-size: 12px; color: var(--dim); text-transform: none; }
  .badge { display: inline-block; font-size: 10px; color: var(--accent); background: rgba(255,70,82,0.08); border: 1px solid var(--line-2); padding: 1px 7px; margin-left: 8px; vertical-align: middle; font-weight: 700; }

  /* world select: 3x3 + floating build tile */
  .worlds-wrap { position: relative; }
  .worlds-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .world-card {
    background: var(--panel); border: 2px solid var(--line);
    padding: 13px 12px; text-align: left; color: var(--text); cursor: pointer; width: 100%;
    transition: border-color 130ms ease-out, background 130ms ease-out;
  }
  .world-card:hover { border-color: var(--accent); background: var(--panel-2); }
  .world-card h3 { font-size: 12px; line-height: 1.35; }
  .world-card p { font-size: 10px; color: var(--dim); text-transform: none; margin-top: 4px; }

  /* quiz */
  .hud { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; flex-wrap: wrap; }
  .hud .stage { color: var(--accent); font-weight: 700; }
  .prog-bar { height: 10px; background: var(--panel); border: 2px solid var(--line); margin-bottom: 18px; overflow: hidden; }
  .prog-fill { height: 100%; background: var(--accent); transition: width 250ms ease-out; }

  .question-card { background: var(--panel); border: 2px solid var(--line); padding: 22px; margin-bottom: 16px; }
  .question-card h2 { font-size: 17px; line-height: 1.5; margin-bottom: 4px; }
  .q-meta { font-size: 11px; color: var(--dim); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }
  .options { display: grid; gap: 10px; }
  .opt {
    background: var(--panel-2); border: 2px solid var(--line);
    padding: 12px 15px; text-align: left; color: var(--text); cursor: pointer;
    transition: border-color 130ms ease-out, opacity 130ms ease-out;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:disabled { cursor: default; }
  .opt.dim { opacity: 0.35; }
  .opt.correct { border-color: var(--pink); background: rgba(255,105,180,0.08); }
  .opt.wrong { border-color: var(--purple); background: rgba(168,85,247,0.08); }
  .feedback { padding: 12px 15px; margin-top: 14px; font-size: 13px; border: 2px solid; animation: fadeIn 200ms ease-out both; }
  .feedback.good { border-color: var(--pink); color: var(--pink); }
  .feedback.bad { border-color: var(--purple); color: var(--purple); }
  .next-btn {
    margin-top: 16px; width: 100%; padding: 13px; border: 2px solid var(--line-2);
    background: var(--panel-2); color: var(--accent); font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
    transition: border-color 130ms ease-out, background 130ms ease-out;
  }
  .next-btn:hover { border-color: var(--accent); background: rgba(255,70,82,0.08); }

  /* results */
  .result-card { background: var(--panel); border: 2px solid var(--line); padding: 26px; text-align: center; }
  .result-card h2 { font-size: 24px; margin: 12px 0 6px; }
  .result-card h2.win { color: var(--accent); }
  .big-score { font-size: 44px; font-weight: 700; color: var(--text); animation: fadeIn 400ms ease-out both; }
  .coin-award { display: inline-block; margin-top: 14px; color: var(--accent); font-size: 15px; font-weight: 700; border: 2px solid var(--line-2); padding: 7px 14px; }
  .stat-row { display: flex; justify-content: center; gap: 26px; margin: 18px 0; flex-wrap: wrap; }
  .stat-row .label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; display: block; }
  .stat-row .val { font-size: 19px; font-weight: 700; color: var(--text); }
  .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  .btn-secondary {
    padding: 11px 18px; border: 2px solid var(--line); background: var(--panel-2);
    color: var(--text); font-weight: 700; font-size: 13px; text-transform: uppercase;
    letter-spacing: 1px; cursor: pointer;
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger { padding: 8px 14px; border: 2px solid var(--line-2); background: var(--panel-2); color: var(--accent); font-size: 12px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }

  /* forms / editor */
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 6px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
  .field input[type="text"], .field input[type="password"], .field input[type="email"], .field input[type="number"], .field textarea {
    width: 100%; background: var(--panel-2); border: 2px solid var(--line); padding: 10px 12px;
    color: var(--text); font: inherit; font-size: 14px;
  }
  .field textarea { min-height: 70px; resize: vertical; }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
  .edit-card { background: var(--panel); border: 2px solid var(--line); padding: 18px; margin-bottom: 14px; }
  .edit-card h3 { font-size: 13px; margin-bottom: 12px; color: var(--accent); }
  .opt-edit-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .opt-edit-row input[type="radio"] { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }
  .opt-edit-row input[type="text"] { flex: 1; }
  .correct-hint { font-size: 11px; color: var(--dim); margin-bottom: 10px; text-transform: none; }
  .link-btn { background: none; border: none; color: var(--accent); font-size: 13px; font-weight: 700; cursor: pointer; padding: 4px 0; text-transform: uppercase; letter-spacing: 1px; }
  .link-btn:hover { text-decoration: underline; }
  .ghost-danger { background: none; border: none; color: var(--dim); font-size: 12px; cursor: pointer; padding: 4px 0; text-transform: uppercase; letter-spacing: 1px; }
  .ghost-danger:hover { color: var(--accent); }

  /* list rows */
  .saved-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--panel); border: 2px solid var(--line); padding: 12px 15px;
    margin-bottom: 10px; flex-wrap: wrap;
  }
  .saved-item h3 { font-size: 13px; }
  .saved-item p { font-size: 11px; color: var(--dim); text-transform: none; }
  .saved-item .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  /* settings */
  .settings-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 2px solid var(--line); gap: 12px; flex-wrap: wrap; }
  .settings-row:last-of-type { border-bottom: none; }
  .settings-row .desc { font-size: 12px; color: var(--dim); text-transform: none; }
  .settings-row strong { font-size: 13px; }
  .seg { display: flex; background: var(--panel-2); border: 2px solid var(--line); }
  .seg button { background: none; border: none; color: var(--dim); padding: 7px 13px; font: inherit; font-size: 13px; cursor: pointer; font-weight: 700; }
  .seg button.on { background: var(--accent); color: #000; }

  /* leaderboard */
  .lb-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--panel); border: 2px solid var(--line); padding: 11px 14px; margin-bottom: 10px; }
  .lb-main { flex: 1; min-width: 0; }
  .lb-main h3 { font-size: 12px; }
  .lb-main p { font-size: 11px; color: var(--dim); text-transform: none; }
  .lb-score { font-weight: 700; font-size: 18px; color: var(--text); }
  .empty-note { text-align: center; color: var(--dim); font-size: 13px; padding: 24px 0; text-transform: none; }

  /* collection */
  .crate-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); margin-bottom: 26px; }
  .crate-card { background: var(--panel); border: 2px solid var(--line); padding: 16px; text-align: center; cursor: pointer; width: 100%; color: var(--text); transition: border-color 130ms ease-out, background 130ms ease-out; }
  .crate-card:hover { border-color: var(--accent); background: var(--panel-2); }
  .crate-card.poor { opacity: 0.45; cursor: not-allowed; }
  .crate-card h3 { font-size: 13px; margin: 10px 0 4px; }
  .crate-card .cost { color: var(--accent); font-size: 13px; font-weight: 700; }
  .crate-card .odds { font-size: 10px; color: var(--dim); margin-top: 6px; text-transform: none; line-height: 1.7; }
  .coll-section { margin-bottom: 24px; }
  .coll-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .coll-card { background: var(--panel); border: 2px solid var(--line); padding: 14px 10px; text-align: center; }
  .coll-card .sprite { height: 42px; display: flex; align-items: center; justify-content: center; }
  .coll-card .sprite svg { image-rendering: pixelated; }
  .coll-card .sprite.locked svg { filter: brightness(0); opacity: 0.6; }
  .coll-card h4 { font-size: 11px; margin-top: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
  .coll-card .rarity-tag { font-size: 9px; font-weight: 700; letter-spacing: 1px; margin-top: 5px; display: inline-block; padding: 1px 6px; border: 1px solid var(--line-2); color: var(--dim); }
  .coll-card .count { font-size: 10px; color: var(--dim); margin-top: 4px; }

  /* casino */
  .casino-card { background: var(--panel); border: 2px solid var(--line); padding: 18px; margin-bottom: 12px; }
  .casino-card h3 { font-size: 14px; margin-bottom: 6px; }
  .casino-card .pay { font-size: 11px; color: var(--dim); text-transform: none; }
  .casino-card .grow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  .casino-card input[type="number"] { width: 110px; background: var(--panel-2); border: 2px solid var(--line); padding: 9px 10px; color: var(--text); font: inherit; font-size: 14px; }
  .casino-card input:focus { outline: none; border-color: var(--accent); }
  .casino-result { margin-top: 16px; text-align: center; font-size: 18px; font-weight: 700; min-height: 28px; }
  .casino-result.win { color: var(--accent); }
  .casino-result.lose { color: var(--dim); }
  .casino-result.rolling { color: var(--dim); animation: blink 0.4s steps(1) infinite; font-size: 15px; letter-spacing: 3px; }
  .quick-bets { display: flex; gap: 8px; flex-wrap: wrap; }
  .quick-bets button { background: var(--panel-2); border: 2px solid var(--line); color: var(--dim); font-size: 12px; font-weight: 700; padding: 5px 10px; cursor: pointer; }
  .quick-bets button:hover { border-color: var(--accent); color: var(--accent); }

  /* 777 slot machine */
  .slot-reels { display: flex; gap: 10px; justify-content: center; margin: 18px 0; }
  .reel {
    width: 84px; height: 68px;
    display: flex; align-items: center; justify-content: center;
    background: var(--panel-2); border: 2px solid var(--line-2);
    font-size: 22px; font-weight: 700; color: var(--dim); letter-spacing: 1px;
  }
  .reel.hit { border-color: var(--accent); color: var(--accent); background: rgba(255,59,71,0.06); }
  .reel.spinning { animation: reelShake 0.12s steps(1) infinite; }
  @keyframes reelShake { 0% { transform: translateY(-2px); } 100% { transform: translateY(2px); } }
  @media (prefers-reduced-motion: reduce) { .reel.spinning { animation: none; } }

  /* boot sequence: 777 spinner, login, access bar */
  .center-screen { min-height: 78vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .boot-reels { display: flex; gap: 12px; justify-content: center; margin-bottom: 24px; }
  .boot-reels .reel { font-size: 34px; width: 110px; height: 80px; }
  .jackpot-msg { color: var(--accent); letter-spacing: 5px; font-size: 15px; font-weight: 700; animation: blink 1s steps(1) infinite; }
  .login-box { max-width: 420px; width: 100%; border: 2px solid var(--line); background: rgba(0,0,0,0.45); padding: 34px 30px; }
  .login-box h2 { color: var(--text); font-size: 22px; letter-spacing: 4px; }
  .login-box h2 span { color: var(--accent); }
  .login-box .sub { color: var(--dim); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin: 10px 0 20px; }
  .login-box input { width: 100%; margin-bottom: 18px; box-sizing: border-box; }
  .press-btn { font-family: inherit; background: transparent; color: var(--accent); border: 2px solid var(--accent); padding: 13px 36px; font-size: 15px; font-weight: 700; letter-spacing: 4px; cursor: pointer; text-transform: uppercase; }
  .press-btn:hover { background: rgba(var(--gr), var(--gg), var(--gb), 0.12); }
  .splash .press-btn { margin-top: 30px; }
  .splash .welcome { margin-top: 14px; color: var(--accent); font-size: 14px; letter-spacing: 2px; }
  .access-title { color: var(--text); letter-spacing: 6px; font-size: 16px; }
  .load-bar { width: min(420px, 82vw); height: 18px; border: 2px solid var(--line); margin-top: 18px; padding: 2px; box-sizing: border-box; }
  .load-fill { height: 100%; width: 0%; background: var(--accent); transition: width 3s linear; }
  .access-msg { margin-top: 22px; color: var(--accent); letter-spacing: 5px; font-weight: 700; font-size: 15px; animation: blink 1s steps(1) infinite; }
  @media (prefers-reduced-motion: reduce) { .load-fill { transition: none; } }

  /* leaderboard: one big box, 3 equal pieces */
  .lb-big { display: flex; border: 2px solid var(--line); background: rgba(0,0,0,0.35); }
  .lb-piece { flex: 1 1 0; min-width: 0; padding: 24px 18px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; }
  .lb-piece + .lb-piece { border-left: 2px solid var(--line); }
  .lb-label { color: var(--dim); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }
  .lb-num { color: var(--accent); font-size: 44px; font-weight: 700; line-height: 1.1; }
  .lb-note { color: var(--dim); font-size: 11px; max-width: 240px; }
  @media (max-width: 640px) {
    .lb-big { flex-direction: column; }
    .lb-piece + .lb-piece { border-left: none; border-top: 2px solid var(--line); }
  }


  /* lever + equip cursor */
  .lever { font-family: inherit; background: rgba(0,0,0,0.45); color: var(--text); border: 2px solid var(--line); padding: 10px 26px 10px 18px; display: inline-flex; align-items: center; gap: 16px; cursor: pointer; margin-top: 26px; }
  .lever:hover { border-color: var(--accent); }
  .lever:disabled { opacity: 0.55; }
  .lever-arm { position: relative; width: 8px; height: 36px; background: var(--dim); border-radius: 4px; transform-origin: center bottom; transition: transform 260ms ease-in; }
  .lever-ball { position: absolute; top: -9px; left: 50%; margin-left: -8px; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); }
  .lever.pulled .lever-arm { transform: rotate(180deg); }
  .lever-label { font-size: 13px; font-weight: 700; letter-spacing: 3px; }
  @media (prefers-reduced-motion: reduce) { .lever-arm { transition: none; } }
  .equip-btn { font-family: inherit; font-size: 10px; letter-spacing: 2px; font-weight: 700; background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 5px 0; width: 100%; margin-top: 8px; cursor: pointer; }
  .equip-btn:hover { background: rgba(var(--gr), var(--gg), var(--gb), 0.12); }
  .equip-btn.on { background: var(--accent); color: #000; }
  .coll-card.equipped { box-shadow: 0 0 12px rgba(var(--gr), var(--gg), var(--gb), 0.5); }
  /* feedback */
  .fb-item { background: var(--panel); border: 2px solid var(--line); padding: 12px 15px; margin-bottom: 10px; }
  .fb-item .fb-head { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
  .fb-item .fb-type { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--accent); border: 1px solid var(--line-2); padding: 1px 7px; }
  .fb-item .fb-date { font-size: 10px; color: var(--dim); }
  .fb-item p { font-size: 13px; margin-top: 8px; text-transform: none; }

  /* modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .modal-card { background: var(--panel); border: 2px solid var(--rarity, var(--line-2)); padding: 30px; text-align: center; max-width: 340px; width: 100%; animation: fadeIn 250ms ease-out both; }

    display: block; width: 100%; margin-top: 10px; padding: 11px; font: inherit; font-size: 13px;

      if (c) rects += '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="' + c + '"/>';
    }
  });
  const s = size || 3;
  return '<svg class="pxi" width="' + w * s + '" height="' + h * s + '" viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' + rects + '</svg>';

function renderStartup() {
  setScreen('startup', 'Booting', null);
  app.innerHTML = '';
  const screen = el('div', 'screen center-screen');
  screen.innerHTML =
    '<div class="boot-reels">' +

      '<div class="reel">?</div>' +

    '<span class="lever-arm"><span class="lever-ball"></span></span><span class="lever-label">PULL THE LEVER</span>');
  screen.appendChild(lever);
  app.appendChild(screen);
  const reels = screen.querySelectorAll('.reel');
  let pulled = false;
  lever.onclick = () => {
    if (pulled) return;
    pulled = true;
    lever.classList.add('pulled');
    lever.disabled = true;
    reels.forEach(r => { r.classList.remove('hit'); r.classList.add('spinning'); });
    const ivs = Array.prototype.slice.call(reels).map(reel => setInterval(() => {
      reel.textContent = SLOT_SYMBOLS[Math.floor(Math.random() * SLOT_SYMBOLS.length)];
    }, 70));
    [900, 1500, 2200].forEach((t, i) => setTimeout(() => {
      clearInterval(ivs[i]);
      reels[i].textContent = '7';
      reels[i].classList.remove('spinning');
      reels[i].classList.add('hit');
    }, t));
    setTimeout(() => {
      const msg = screen.querySelector('.jackpot-msg');
      if (msg) msg.hidden = false;
    }, 2300);
    setTimeout(renderLogin, 3400);
  };
}

  setScreen('login', 'Login', null);

  box.innerHTML =

  const emailField = el('div', 'field');

  emailInput.type = 'email';
  emailInput.placeholder = 'EMAIL';
  emailInput.maxLength = 40;
  emailInput.value = settings.email || '';
  emailField.appendChild(emailInput);

  const passField = el('div', 'field');
  passField.innerHTML = '<label>Password</label>';
  const passInput = el('input');
  passInput.type = 'password';
  passInput.placeholder = 'PASSWORD';
  passInput.value = settings.password || '';
  passField.appendChild(passInput);

  const btn = el('button', 'press-btn', 'HACK');
  const go = () => {
    const email = (emailInput.value || '').trim();
    settings.email = email;
    settings.player = email ? email.split('@')[0] : 'PLAYER';
    settings.password = passInput.value;
    store.set('settings', settings);
    renderAccess();
  };
  btn.onclick = go;
  [emailInput, passInput].forEach(inp =>
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); }));

  box.appendChild(emailField);
  box.appendChild(passField);
  box.appendChild(btn);
  screen.appendChild(box);
  app.appendChild(screen);
  setTimeout(() => emailInput.focus(), 60);
}

/* ================= COLLECTION & CRATES (with roll animation) ================= */
function rollRarity(odds) {
  const entries = Object.entries(odds);
  let roll = Math.random() * 100;
  for (const [rarity, chance] of entries) {
    roll -= chance;
    if (roll < 0) return rarity;
  }
  return entries[0][0];
}

function openCrate(crate) {
  if (coins < crate.cost) { toast('Not enough coins — hit the casino'); return; }
  coins -= crate.cost;
  saveCoins();
  updateCoinHUD();

  const pool = crate.pool.map(id => ITEMS.find(i => i.id === id));
  const item = pool[Math.floor(Math.random() * pool.length)];
  const isDupe = !!collection[item.id];
  if (isDupe) {
    collection[item.id] += 1;
    coins += DUPE_REFUND;
    saveCoins();
  } else {
    collection[item.id] = 1;
  }
  saveCollection();
  updateCoinHUD();

  // roll animation modal
  const old = document.querySelector('.modal-bg');
  if (old) old.remove();
  const bg = el('div', 'modal-bg');
  const card = el('div', 'modal-card');
  card.innerHTML =
    '<div class="rarity-label" style="--rarity:var(--accent);color:var(--accent)">OPENING ' + esc(crate.name.toUpperCase()) + '</div>' +
    '<div class="roll-frame" id="rollFrame"></div>' +
    '<div class="roll-status" id="rollStatus">ROLLING</div>';
  bg.appendChild(card);
  bg.onclick = e => { if (e.target === bg) { bg.remove(); renderCollection(); } };
  document.body.appendChild(bg);

  const frame = card.querySelector('#rollFrame');
  const status = card.querySelector('#rollStatus');
  const total = 22;
  let step = 0;
  function spin() {
    if (step >= total) { reveal(); return; }
    const randItem = ITEMS[Math.floor(Math.random() * ITEMS.length)];
    frame.innerHTML = itemSVG(randItem, 6);
    status.textContent = 'ROLLING' + '.'.repeat(1 + (step % 3));
    step++;
    setTimeout(spin, 55 + step * 14);
  }
  function reveal() {
    card.style.setProperty('--rarity', RARITIES[item.rarity].color);
    card.innerHTML =
      '<div class="rarity-label">' + RARITIES[item.rarity].name + '</div>' +
      '<h3>' + esc(item.name) + '</h3>' +
      '<div class="sprite">' + itemSVG(item, 7) + '</div>' +
      (isDupe
        ? '<p class="dupe-note">DUPLICATE — refunded ' + DUPE_REFUND + ' coins</p>'
        : '<p class="dupe-note" style="color:var(--accent)">NEW ITEM ADDED TO COLLECTION!</p>');
    const row = el('div', 'btn-row');
    const again = el('button', 'next-btn', 'Open Another');
    again.style.cssText = 'width:auto;padding:10px 16px';
    again.onclick = () => { bg.remove(); openCrate(crate); };
    const done = el('button', 'btn-secondary', 'Done');
    done.onclick = () => { bg.remove(); renderCollection(); };
    row.append(again, done);
    card.appendChild(row);
  }
  spin();
}

/* ================= SHOP / TRADE ================= */
const PRICES = { common:15, uncommon:40, rare:100, epic:250, legendary:600, mythic:900, exotic:1500, secret:2500 };
const TRADE_CHAIN = ['common','uncommon','rare','epic','legendary','mythic','exotic','secret'];

function ownedUnitsOf(rarity) {
  return ITEMS.filter(i => collection[i.id]).reduce((n, i) => n + collection[i.id], 0);
}

function tradeUp(rarity) {
  const idx = TRADE_CHAIN.indexOf(rarity);
  const next = TRADE_CHAIN[idx + 1];
  if (!next || ownedUnitsOf(rarity) < 3) return;
  let need = 3;
  ITEMS.forEach(i => {
    if (i.rarity !== rarity || need <= 0) return;
    while (collection[i.id] > 0 && need > 0) {
      collection[i.id] -= 1; need -= 1;
      if (collection[i.id] <= 0) delete collection[i.id];
    }
  });
  const pool = ITEMS.filter(i => i.rarity === next);
  const item = pool[Math.floor(Math.random() * pool.length)];
  const isDupe = !!collection[item.id];
  collection[item.id] = (collection[item.id] || 0) + 1;
  saveCollection();
  toast('TRADED 3\u00d7 ' + RARITIES[rarity].name + ' \u2192 ' + esc(item.name) + (isDupe ? '' : ' \u2014 NEW!'));
  renderShop();
}

function renderShop() {
  setScreen('shop', 'Shop / Trade', renderMenu);
  app.innerHTML = '';
  const screen = el('div', 'screen');
  const head = el('div', 'section-head');
  head.appendChild(el('h2', null, 'SHOP <span>/ TRADE</span>'));
  head.appendChild(el('p', null, 'Buy any controller with coins, or trade 3 of a rarity up for 1 of the next.'));
  screen.appendChild(head);

  TRADE_CHAIN.forEach(r => {
    const items = ITEMS.filter(i => i.rarity === r);
    if (!items.length) return;
    const sec = el('div', 'coll-section');
    const secHead = el('div', 'section-head');
    secHead.style.marginBottom = '10px';
    secHead.innerHTML = '<h3 style="font-size:12px;color:' + RARITIES[r].color + '">' + RARITIES[r].name +
      ' <span style="color:var(--dim);font-weight:400">' + PRICES[r] + ' coins each</span></h3>';
    sec.appendChild(secHead);

    const nextIdx = TRADE_CHAIN.indexOf(r) + 1;
    if (TRADE_CHAIN[nextIdx]) {
      const can = ownedUnitsOf(r) >= 3;
      const t = el('button', 'ghost-danger');
      t.style.cssText = 'display:block;width:100%;margin-bottom:10px;' + (can ? '' : 'opacity:0.45;cursor:not-allowed');
      t.textContent = 'TRADE 3\u00d7 ' + RARITIES[r].name + '  \u2192  1\u00d7 ' + RARITIES[TRADE_CHAIN[nextIdx]].name;
      t.onclick = () => { if (can) tradeUp(r); };
      sec.appendChild(t);
    }

    const grid = el('div', 'coll-grid');
    items.forEach(item => {
      const owned = !!collection[item.id];
      const card = el('div', 'coll-card');
      card.style.borderColor = RARITIES[item.rarity].color;
      card.innerHTML =
        '<div class="sprite">' + itemSVG(item, 3) + '</div>' +
        '<h4>' + esc(item.name) + '</h4>' +
        '<span class="rarity-tag">' + (owned ? 'OWNED' : PRICES[item.rarity] + ' COINS') + '</span>';
      if (!owned) {
        const buy = el('button', 'equip-btn', 'BUY');
        buy.onclick = () => {
          if (coins < PRICES[item.rarity]) { toast('Not enough coins'); return; }
          coins -= PRICES[item.rarity];
          collection[item.id] = 1;
          saveCoins(); saveCollection(); updateCoinHUD();
          toast('Purchased ' + esc(item.name) + '!');
          renderShop();
        };
        card.appendChild(buy);
      }
      grid.appendChild(card);
    });
    sec.appendChild(grid);
    screen.appendChild(sec);
  });

  app.appendChild(screen);
}

function applyFont() {
  const f = FONTS.find(x => x.id === fontState.equipped) || FONTS[0];

}

function openFontBox() {
  if (coins < FONT_BOX_COST) { toast('Not enough coins \u2014 hit the casino'); return; }
  const pool = FONTS.filter(f => !fontState.unlocked.includes(f.id));
  if (!pool.length) { toast('All fonts unlocked!'); return; }
  coins -= FONT_BOX_COST;
  const f = pool[Math.floor(Math.random() * pool.length)];
  fontState.unlocked.push(f.id);
  store.set('fonts', fontState);
  saveCoins();
  updateCoinHUD();

  const old = document.querySelector('.modal-bg');

function cursorURL(item) {
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(itemSVG(item, 2));

  let tag = document.getElementById('cursorStyle');

/* ================= CASINO (777 SPINNER) ================= */
const SLOT_SYMBOLS = ['7', 'MISS', 'X', 'O'];

function renderCasino() {
  setScreen('casino', 'Casino', renderMenu);
  app.innerHTML = '';
  const screen = el('div', 'screen');
  const head = el('div', 'section-head');
  head.appendChild(el('h2', null, 'LUCKY <span>SEVENS</span>'));
  head.appendChild(el('p', null, 'Spin the reels — hit 777 for the jackpot. The house always has an edge.'));
  screen.appendChild(head);

  const betCard = el('div', 'casino-card');
  betCard.innerHTML = '<h3>Your Bet</h3>';
  const betField = el('div', 'field');
  betField.innerHTML = '<label>Coins to wager</label>';
  const betInput = el('input');
  betInput.type = 'number';
  betInput.min = '1';
  betInput.value = '25';
  betField.appendChild(betInput);
  betCard.appendChild(betField);
  const quick = el('div', 'quick-bets');
  [25, 50, 100, 500].forEach(v => {
    const b = el('button', null, String(v));
    b.onclick = () => { betInput.value = String(v); };
    quick.appendChild(b);
  });
  const allIn = el('button', null, 'ALL IN');
  allIn.onclick = () => { betInput.value = String(coins); };
  quick.appendChild(allIn);
  betCard.appendChild(quick);
  screen.appendChild(betCard);

  const result = el('div', 'casino-result');

  function getBet() {
    const v = parseInt(betInput.value || '0', 10);
    if (isNaN(v) || v <= 0) { toast('Enter a bet above 0'); return null; }
    if (v > coins) { toast('You only have ' + coins + ' coins'); return null; }
    return v;
  }

  // 777 spinner machine
  const slotCard = el('div', 'casino-card');
  slotCard.innerHTML =
    '<h3>777 Spinner</h3>' +
    '<p class="pay">777 = 8x jackpot · any triple = 3x · two 7s = 2x · any pair = bet back.</p>';

  const reelsWrap = el('div', 'slot-reels');
  const reels = [];
  for (let i = 0; i < 3; i++) {
    const r = el('div', 'reel', '7');
    reelsWrap.appendChild(r);
    reels.push(r);
  }
  slotCard.appendChild(reelsWrap);

  const spinBtn = el('button', 'next-btn', 'SPIN');
  spinBtn.style.width = '100%';
  let spinning = false;
  spinBtn.onclick = () => {
    if (spinning) return;
    const bet = getBet();
    if (bet === null) return;
    spinning = true;
    coins -= bet; saveCoins(); updateCoinHUD();
    spinBtn.disabled = true;
    spinBtn.textContent = 'SPINNING';
    reels.forEach(r => { r.classList.remove('hit'); r.classList.add('spinning'); });
    result.className = 'casino-result rolling';
    result.textContent = 'SPINNING';

    // predetermined outcome
    const final = [0, 1, 2].map(() => SLOT_SYMBOLS[Math.floor(Math.random() * SLOT_SYMBOLS.length)]);
    const stopAt = [900, 1500, 2200];
    const ivs = reels.map(reel => setInterval(() => {
      reel.textContent = SLOT_SYMBOLS[Math.floor(Math.random() * SLOT_SYMBOLS.length)];
    }, 70));
    final.forEach((s, i) => setTimeout(() => {
      clearInterval(ivs[i]);
      reels[i].textContent = s;
      reels[i].classList.remove('spinning');
    }, stopAt[i]));

    setTimeout(() => {
      const sevens = final.filter(s => s === '7').length;
      let mult = 0, msg = '';
      if (sevens === 3) { mult = 8; msg = 'JACKPOT! 777!'; }
      else if (final[0] === final[1] && final[1] === final[2]) { mult = 3; msg = 'TRIPLE ' + final[0] + '!'; }
      else if (sevens === 2) { mult = 2; msg = 'TWO 7s!'; }
      else if (final[0] === final[1] || final[1] === final[2] || final[0] === final[2]) { mult = 1; msg = 'PAIR — BET BACK'; }

      if (mult > 0) {
        coins += bet * mult;
        saveCoins();
        result.className = 'casino-result win';
        result.textContent = msg + '  +' + (bet * mult) + ' coins';
        if (mult >= 2) reels.forEach(r => r.classList.add('hit'));
      } else {
        result.className = 'casino-result lose';
        result.textContent = 'NO MATCH  -' + bet + ' coins';
      }
      updateCoinHUD();
      spinning = false;
      spinBtn.disabled = false;
      spinBtn.textContent = 'SPIN';
    }, 2400);
  };
  slotCard.appendChild(spinBtn);
  screen.appendChild(slotCard);

  screen.appendChild(result);
  app.appendChild(screen);
}

  app.appendChild(screen);
}
/* ================= ADMIN PANEL (PIN protected) ================= */
const ADMIN_PIN = '123';

function adminModal(html) {
  const old = document.querySelector('.modal-bg.admin');
  if (old) old.remove();
  const bg = el('div', 'modal-bg admin');
  const card = el('div', 'modal-card admin-card');
  card.style.setProperty('--rarity', 'var(--accent)');
  card.innerHTML = html;
  bg.appendChild(card);
  bg.onclick = e => { if (e.target === bg) bg.remove(); };
  document.body.appendChild(bg);
  return { bg, card };
}

function promptAdminPin() {
  const { card } = adminModal(
    '<div class="rarity-label">RESTRICTED ACCESS</div>' +
    '<h3>Admin Login</h3>' +
    '<input type="password" id="adminPin" placeholder="Enter PIN" autocomplete="off">' +
    '<button class="admin-btn" id="adminPinGo">Unlock</button>' +
    '<p class="dupe-note" style="color:var(--dim);font-size:11px;margin-top:10px">Wrong PIN closes this window.</p>');
  const input = card.querySelector('#adminPin');
  const go = card.querySelector('#adminPinGo');
  const attempt = () => {
    if (input.value === ADMIN_PIN) {
      card.parentElement.remove();
      openAdminPanel();
    } else {
      card.parentElement.remove();
    }
  };
  go.onclick = attempt;
  input.onkeydown = e => { if (e.key === 'Enter') attempt(); };
  input.focus();
}

function openAdminPanel() {
  const { card } = adminModal(
    '<div class="rarity-label">ADMIN PANEL</div>' +
    '<h3>Owner Controls</h3>' +
    '<div class="admin-inline"><label>Set coin balance</label><input type="number" id="adCoinVal" min="0" value="' + coins + '"></div>' +
    '<button class="admin-btn" id="adSetCoins">Apply Coin Balance</button>' +
    '<button class="admin-btn" id="adCoins">+100 Coins</button>' +
    '<button class="admin-btn" id="adUnlock">Unlock All Collectibles</button>' +
    '<button class="admin-btn" id="adClearColl">Clear Collection</button>' +
    '<button class="admin-btn danger" id="adReset">Reset ALL Progress</button>' +
    '<button class="admin-btn" id="adClose">Close</button>');

  const done = () => { card.parentElement.remove(); setScreen(currentScreen, screenTitle.textContent, backTarget); };

  card.querySelector('#adSetCoins').onclick = () => {
    const v = parseInt(card.querySelector('#adCoinVal').value || '', 10);
    if (!isNaN(v) && v >= 0) {
      coins = v;
      saveCoins();
      updateCoinHUD();
      toast('Balance set to ' + v);
      done();
    } else {
      toast('Enter a valid number');
    }
  };
  card.querySelector('#adCoins').onclick = () => {
    coins += 100; saveCoins(); updateCoinHUD(); toast('+100 coins'); done();
  };
  card.querySelector('#adUnlock').onclick = () => {
    ITEMS.forEach(i => { collection[i.id] = Math.max(collection[i.id] || 0, 1); });
    saveCollection(); toast('All ' + ITEMS.length + ' collectibles unlocked'); done();
  };
  card.querySelector('#adClearColl').onclick = () => {
    if (confirm('Clear the entire collection?')) { collection = {}; saveCollection(); toast('Collection cleared'); done(); }
  };
  card.querySelector('#adReset').onclick = () => {
    if (confirm('Reset ALL progress (coins, collection, fonts)?')) {
      coins = 0; collection = {};
      fontState = { unlocked: ['mono'], equipped: 'mono' };
      saveCoins(); saveCollection(); store.set('fonts', fontState); applyFont();
      updateCoinHUD();
      toast('All progress reset'); done();
    }
  };
  card.querySelector('#adClose').onclick = done;
}

document.getElementById('adminBtn').onclick = promptAdminPin;

/* ================= BOOT ================= */
applyTheme(settings.theme);
applyEquippedCursor();
applyFont();
renderStartup();
</script>
</body>
